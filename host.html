<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>50音打地鼠｜主持人</title>
<style>
:root{--ink:#443653;--muted:#766d82;--pink:#ff79a7;--lav:#a98cff;--mint:#7fdab4;--yellow:#ffd56a;--card:#ffffffef;--shadow:0 18px 45px rgba(76,57,98,.15)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 8%,#ffe1ec 0,transparent 25%),radial-gradient(circle at 92% 7%,#e6dcff 0,transparent 27%),linear-gradient(145deg,#fff9ef,#eef9ff)}
button{font:inherit}.wrap{width:min(1180px,calc(100% - 24px));margin:auto;padding:22px 0}.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);border:1px solid #fff}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.panel{padding:22px}header{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:16px}h1{margin:0;font-size:clamp(30px,5vw,48px)}.sub{margin:7px 0 0;color:var(--muted);line-height:1.55}.pill{display:inline-flex;padding:8px 12px;border-radius:999px;background:#f3eef7;font-weight:900}.room{font-size:clamp(54px,8vw,90px);font-weight:1000;letter-spacing:.15em;text-align:center;color:#654e7f;margin:8px 0}.qrbox{min-height:270px;display:grid;place-items:center;background:#fff;border:2px dashed #e2d8e8;border-radius:22px;padding:14px}.joinurl{font-size:13px;color:var(--muted);word-break:break-all;text-align:center;margin-top:10px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:17px;padding:13px 17px;font-weight:900;cursor:pointer}.primary{background:var(--pink);color:#fff}.secondary{background:var(--lav);color:#fff}.green{background:var(--mint);color:#315b49}.players{display:grid;gap:9px;max-height:520px;overflow:auto}.player{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #eee6f2;border-radius:17px;padding:12px 14px}.rank{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#f4eff7;font-weight:1000}.score{font-size:22px;font-weight:1000;color:#654e7f}.statusrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px}.timer{font-size:48px;font-weight:1000;color:#e45c86}.note{margin-top:14px;padding:12px 14px;border-radius:16px;background:#fff6d9;color:#765f27;line-height:1.5;font-size:14px}@media(max-width:820px){.grid{grid-template-columns:1fr}header{flex-direction:column}}
</style>
</head>
<body>
<main class="wrap">
<header><div><h1>🐹 50音打地鼠｜主持人</h1><p class="sub">學生掃 QR Code、輸入名字。你按開始後，全班同步玩 60 秒。</p></div><span class="pill">46個平假名</span></header>
<section class="grid">
<div class="card panel">
<div class="statusrow"><strong>教室房間碼</strong><span id="roomStatus" class="pill">等待加入</span></div>
<div id="roomCode" class="room">----</div>
<div class="qrbox"><div id="qr"></div></div>
<div id="joinUrl" class="joinurl"></div>
<div class="actions">
<button id="newRoom" class="btn secondary">建立新房間</button>
<button id="start" class="btn primary">▶ 開始60秒</button>
<button id="reset" class="btn green">↺ 同一批再玩</button>
</div>
<div class="note">QR Code 會自動使用目前網站的 player.html 網址。因此只要把整個資料夾部署到 GitHub Pages，之後學校電腦直接開網址即可。</div>
</div>
<div class="card panel">
<div class="statusrow"><div><strong id="boardTitle">參加者</strong><div id="count" class="sub">0 人已加入</div></div><div id="timer" class="timer">01:00</div></div>
<div id="players" class="players"><div class="sub" style="text-align:center;padding:30px">還沒有人加入 🌱</div></div>
</div>
</section>
</main>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
firebase.initializeApp(window.FIREBASE_CONFIG||{});const db=firebase.database();
const el=id=>document.getElementById(id);let room='',players={},clock=null,endAt=0;
function code(){return String(Math.floor(1000+Math.random()*9000))}
function playerUrl(){const u=new URL(location.href);u.pathname=u.pathname.replace(/host\.html$/,'player.html');u.search='';u.hash='';return u.toString()+'?room='+room}
function qr(){el('qr').innerHTML='';const url=playerUrl();el('joinUrl').textContent=url;new QRCode(el('qr'),{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}
async function createRoom(){room=code();el('roomCode').textContent=room;qr();await db.ref('rooms/'+room).set({status:'waiting',duration:60,createdAt:firebase.database.ServerValue.TIMESTAMP});listen()}
function listen(){db.ref('rooms/'+room+'/players').off();db.ref('rooms/'+room).off();db.ref('rooms/'+room+'/players').on('value',s=>{players=s.val()||{};render()});db.ref('rooms/'+room).on('value',s=>{const st=(s.val()||{}).status||'waiting';el('roomStatus').textContent=st==='running'?'遊戲中':st==='finished'?'已結束':'等待加入';el('boardTitle').textContent=st==='finished'?'最終排名':st==='running'?'即時排行':'參加者'})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const arr=Object.entries(players).map(([id,p])=>({id,...p})).sort((a,b)=>(b.score||0)-(a.score||0)||String(a.name).localeCompare(String(b.name),'zh-Hant'));el('count').textContent=arr.length+' 人已加入';el('players').innerHTML=arr.length?arr.map((p,i)=>`<div class="player"><div style="display:flex;align-items:center;gap:10px"><div class="rank">${i+1}</div><strong>${esc(p.name||'同學')}</strong></div><div class="score">${p.score||0}分</div></div>`).join(''):'<div class="sub" style="text-align:center;padding:30px">還沒有人加入 🌱</div>'}
async function start(){const up={};Object.keys(players).forEach(id=>up['players/'+id+'/score']=0);await db.ref('rooms/'+room).update(up);endAt=Date.now()+60000;await db.ref('rooms/'+room).update({status:'running',startAt:Date.now(),endAt});clearInterval(clock);clock=setInterval(()=>{const s=Math.max(0,Math.ceil((endAt-Date.now())/1000));el('timer').textContent='00:'+String(s).padStart(2,'0');if(s<=0){clearInterval(clock);db.ref('rooms/'+room+'/status').set('finished')}},150)}
async function reset(){clearInterval(clock);el('timer').textContent='01:00';const up={status:'waiting',startAt:null,endAt:null};Object.keys(players).forEach(id=>up['players/'+id+'/score']=0);await db.ref('rooms/'+room).update(up)}
el('start').onclick=start;el('reset').onclick=reset;el('newRoom').onclick=createRoom;createRoom();
</script>
</body>
</html>
